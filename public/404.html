    <style>
      :root { color-scheme: light dark; --paper:#f2eedb; --sheet:#fffdf4; --ink:#171814; --muted:#55594f; --orange:#f04b23; --blue:#1848c7; }
      * { box-sizing:border-box; } body { min-height:100vh; margin:0; background-color:var(--paper); background-image:linear-gradient(rgba(23,24,20,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(23,24,20,.035) 1px,transparent 1px); background-size:24px 24px; color:var(--ink); font:16px/1.5 Arial,Helvetica,sans-serif; }
      a:focus-visible { outline:4px solid var(--blue); outline-offset:3px; } a { color:var(--blue); text-underline-offset:3px; text-decoration-thickness:2px; } .skip { position:fixed; top:8px; left:8px; transform:translateY(-160%); background:var(--ink); color:var(--sheet); padding:12px 16px; font-weight:800; } .skip:focus { transform:none; }
      header, footer { display:flex; align-items:center; justify-content:space-between; gap:20px; border-bottom:2px solid var(--ink); background:var(--sheet); padding:16px clamp(16px,4vw,56px); } .wordmark { display:flex; align-items:center; gap:10px; min-height:44px; color:var(--ink); font-size:18px; font-weight:900; text-decoration:none; text-transform:uppercase; } .mark { display:grid; width:40px; height:40px; place-items:center; border:2px solid var(--ink); background:var(--orange); color:#171814; font:900 14px ui-monospace,monospace; transform:rotate(-3deg); }
      main { width:min(740px,calc(100% - 40px)); margin:0 auto; padding:clamp(56px,12vw,120px) 0; } .eyebrow { margin:0 0 12px; color:var(--muted); font:800 12px ui-monospace,monospace; letter-spacing:.08em; } h1 { max-width:12ch; margin:0; font:900 clamp(42px,10vw,72px)/.98 "Arial Black",Arial,sans-serif; letter-spacing:-.05em; } main p:not(.eyebrow) { max-width:38rem; font-size:18px; line-height:1.65; } .actions { display:flex; flex-wrap:wrap; gap:14px; margin-top:32px; } .button { display:inline-flex; align-items:center; justify-content:center; min-width:44px; min-height:48px; border:2px solid var(--ink); padding:12px 18px; font-weight:900; } .primary { background:var(--orange); color:var(--ink); box-shadow:4px 4px 0 var(--ink); text-decoration:none; } .secondary { background:var(--sheet); color:var(--ink); box-shadow:4px 4px 0 var(--blue); } footer { border-top:2px solid var(--ink); border-bottom:0; color:var(--muted); font-size:13px; } footer nav { display:flex; flex-wrap:wrap; gap:16px; }
      @media (prefers-color-scheme:dark) { :root { --paper:#171814; --sheet:#23251f; --ink:#f8f4e4; --muted:#babdaf; --orange:#ff6842; --blue:#84a1ff; } body { background-image:linear-gradient(rgba(248,244,228,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(248,244,228,.03) 1px,transparent 1px); } .primary { color:#171814; box-shadow:4px 4px 0 var(--blue); } .secondary { box-shadow:4px 4px 0 var(--orange); } }
      @media (max-width:600px) { header, footer { align-items:flex-start; flex-direction:column; padding:14px 16px; } footer { gap:8px; } }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition-duration:.01ms!important; animation-duration:.01ms!important; } }
    </style>
